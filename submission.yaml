  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Our mission-aware readiness engine goes beyond a simple ready or not-ready
    classification by explaining asset health, predicting failure risks, and
    prioritising maintenance based on operational impact.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The prototype currently uses available or simulated HUMS sensor and
    maintenance data, and predictions are designed for decision support rather
    than deployment in safety-critical operational environments.

