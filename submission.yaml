  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Military organisations struggle to accurately determine whether aircraft,
    vehicles, and critical equipment are mission-ready because valuable HUMS
    sensor data and maintenance records are often analysed reactively rather
    than used to predict failures. This leads to unexpected equipment failures,
    reduced operational readiness, and inefficient maintenance prioritisation.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    AssetSentinel is an explainable mission-readiness intelligence platform
    that analyses sensor data, usage patterns, and service records to calculate
    dynamic readiness scores, predict component failure risks, and recommend
    prioritised maintenance actions. A conversational copilot helps users
    understand readiness issues and make faster maintenance decisions.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Dynamic mission readiness scoring based on component health and mission requirements"
    - "Predictive component failure analysis using sensor trends and maintenance history"
    - "Explainable risk analysis showing why an asset is classified as ready or non-ready"
    - "Mission-aware readiness evaluation for different mission criticality levels"
    - "Prioritised maintenance recommendations based on failure risk and operational impact"                              # optional 5th

